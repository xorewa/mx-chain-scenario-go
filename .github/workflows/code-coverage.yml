name: Code-coverage

on:
  push:
    branches:
      - NewArc
  pull_request:
    branches: [ NewArc ]

permissions:
  contents: read

jobs:
  build:
    env:
      GONOSUMDB: github.com/xorewa/*
    strategy:
      matrix:
        runs-on: [ubuntu-latest]
    runs-on: ${{ matrix.runs-on }}
    name: Build
    steps:
      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.2
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Get dependencies
        run: go mod download
      - name: Run unit tests
        run: |
          go test ./... -short -cover -coverprofile=coverage.txt -covermode=atomic
