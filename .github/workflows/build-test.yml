name: Build and run tests

on:
  pull_request:
    branches: [ NewArc ]
  push:
    branches: [ NewArc ]

permissions:
  contents: read

jobs:
  test:
    env:
      GONOSUMDB: github.com/xorewa/*
    strategy:
      matrix:
        go-version: [1.26.2]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Download modules
      run: go mod download
    - name: Test
      run: |
          go test ./...
